name: UI desktop tests

# Runs the :ui desktopTest source set (Compose pointer tests such as
# DragSelectPointerTest and ArchiveDragSelectPointerTest), which neither
# android-preview (testDebugUnitTest) nor build (:desktop:test) executes.
# Manual dispatch only, mirroring desktop-preview's test_filter pattern.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional Gradle --tests filter for the UI test step (diagnostics)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ui-desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: UI desktop tests
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            ./gradlew :ui:desktopTest --tests "$TEST_FILTER"
          else
            ./gradlew :ui:desktopTest
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: ui/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
