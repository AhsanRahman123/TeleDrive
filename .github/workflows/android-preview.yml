name: Android preview APK

on:
  push:
    branches:
      - android/touch-preview-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android preview branch
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble universal debug APK
        run: ./gradlew :android:assembleDebug -PwithFfmpegDecoder -PsplitAbis=false

      - name: Verify isolated preview package ID
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/build/outputs/apk/debug -name '*-universal-debug.apk' -print -quit)"
          test -n "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          echo "Built Android package ID: $package"
          test "$package" = "com.drdisagree.teledrive.preview"
          echo "Verified separate preview package: $package" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-Android-Preview
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
