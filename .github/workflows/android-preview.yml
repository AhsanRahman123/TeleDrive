name: Android preview APK

on:
  push:
    branches:
      - android/touch-preview-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android preview branch
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble universal debug APK
        run: ./gradlew :android:assembleDebug -PwithFfmpegDecoder -PsplitAbis=false

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-Android-Preview
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
