name: Desktop preview MSI

on:
  push:
    branches:
      - desktop/pranto-drive-pc-20261119
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop tests and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Desktop tests
        run: ./gradlew :shared:desktopTest :ui:desktopTest :desktop:test

      - name: Cache VLC natives
        uses: actions/cache@v6
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            shared/build/test-results/**/*.xml
            ui/build/test-results/**/*.xml
            desktop/build/test-results/**/*.xml
          if-no-files-found: ignore

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v7
        with:
          name: PrantoDrive-windows
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
