name: Desktop preview MSI

# Branch-local adaptation for fix/zip-selection-offset-android-20261123: this
# Android lineage's :shared:desktopTest does not compile (pre-existing:
# BackupHoldDrainTest/LargeDownloadTest/SplitReuploadCancelTest miss a
# fileRepository argument) and the MSI packaging steps belong to the PC
# branches, so this copy runs only the :ui desktopTest step — the suite that
# carries the Compose pointer tests — and uploads its result XMLs.

on:
  push:
    branches:
      - desktop/pranto-drive-pc-20261119
      - pranto/merged-1.6-20261119
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional Gradle --tests filter for the UI test step (diagnostics)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop tests and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: UI desktop tests
        timeout-minutes: 12
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ inputs.test_filter }}" -ne "") { $extra = @("--tests", "${{ inputs.test_filter }}") }
          ./gradlew :ui:desktopTest @extra

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            shared/build/test-results/**/*.xml
            ui/build/test-results/**/*.xml
            desktop/build/test-results/**/*.xml
          if-no-files-found: ignore
